<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kanelbulle demo</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #333; }
    a { margin-right: 8px; }
  </style>
</head>
<body>
  <h1>Kanelbulle</h1>
  <p>A cookie banner, but for buns. Pick a position and a language:</p>
  <p id="links"></p>
  <p><button onclick="localStorage.clear(); location.reload()">Reset dismissal</button></p>

  <script>
    var q = new URLSearchParams(location.search);
    document.documentElement.lang = q.get('lang') || 'en';
    window.KanelbulleConfig = { position: q.get('position') || 'bottom', theme: q.get('theme') || 'auto' };
    // Pretend it's Kanelbullens dag so the banner shows in the demo
    var RealDate = Date;
    window.Date = class extends RealDate {
      constructor(...a) { super(...(a.length ? a : [new RealDate().getFullYear(), 9, 4])); }
    };
    document.getElementById('links').innerHTML =
      ['bottom', 'top', 'bottom-left', 'bottom-right', 'top-left', 'top-right', 'center']
        .map(function (p) {
          return p + ': <a href="?position=' + p + '&lang=sv">sv</a><a href="?position=' + p + '&lang=en">en</a>';
        }).join('<br>') +
      '<br><br>theme: ' + ['auto', 'light', 'dark'].map(function (th) {
        var p = new URLSearchParams(location.search); p.set('theme', th);
        return '<a href="?' + p + '">' + th + '</a>';
      }).join('');
  </script>
  <script src="kanelbulle.js"></script>
</body>
</html>
