<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kanelbulle - a cookie banner, but for buns</title>
  <style>
    :root { --fg: #000; --mu: #6b6b6b; --ul: rgba(0,0,0,.25); --bg: #fafafa; --code: #fff; --line: #e6e6e6; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #fff; --mu: #9a9a9a; --ul: rgba(255,255,255,.3); --bg: #0a0a0a; --code: #151515; --line: #262626; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      background: var(--bg); color: var(--fg); -webkit-font-smoothing: antialiased;
      font: 15px/1.55 system-ui, -apple-system, "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    main { flex: 1; width: 100%; max-width: 560px; margin: 0 auto; padding: 18vh 24px 64px; }
    .eyebrow { margin: 0 0 12px; color: var(--mu); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }
    h1 { margin: 0 0 12px; font-size: 40px; line-height: 1.1; font-weight: 600; letter-spacing: -.02em; }
    .lead { margin: 0 0 40px; color: var(--mu); font-size: 17px; }
    .code { display: flex; align-items: baseline; gap: 16px; margin: 0 0 48px; padding: 16px; background: var(--code); border: 1px solid var(--line); }
    pre { flex: 1; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.6 ui-monospace, "SF Mono", Menlo, monospace; }
    dl { margin: 0; display: grid; grid-template-columns: 96px 1fr; gap: 14px 16px; }
    dt { color: var(--mu); }
    dd { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 18px; }
    a, button { color: var(--mu); font: inherit; font-weight: 500; text-decoration: none; background: none; border: 0; padding: 0; cursor: pointer; }
    a:hover, button:hover, [aria-current] { color: var(--fg); }
    [aria-current], .u { text-decoration: underline 1px var(--ul); text-underline-offset: 4px; }
    #copy { flex: none; font-size: 13px; }
    #reset { margin-top: 40px; }
    footer { width: 100%; max-width: 560px; margin: 0 auto; padding: 24px; display: flex; justify-content: space-between; color: var(--mu); font-size: 13px; }
    footer a { color: var(--fg); }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Kanelbullens dag &middot; 4 October</p>
    <h1>Kanelbulle</h1>
    <p class="lead">A cookie banner, but for buns. One script tag, and on October 4th your visitors are invited to fika.</p>

    <div class="code"><pre><code id="snippet"></code></pre><button id="copy">Copy</button></div>

    <dl id="options"></dl>
    <button id="reset" class="u">Show the banner again</button>
  </main>

  <footer>
    <span>Made by <a class="u" href="https://www.blixtdunder.com">Blixt &amp; Dunder</a></span>
    <a class="u" href="https://github.com/BlixtDunder/Kanelbulle">GitHub</a>
  </footer>

  <script>
    var q = new URLSearchParams(location.search);
    var choices = {
      mode: ['day', 'countdown'],
      position: ['bottom-left', 'bottom-right', 'top-left', 'top-right', 'center', 'bottom', 'top'],
      lang: ['en', 'sv'],
      theme: ['auto', 'light', 'dark']
    };
    var cfg = {};
    Object.keys(choices).forEach(function (k) { cfg[k] = q.get(k) || choices[k][0]; });

    document.getElementById('options').innerHTML = Object.keys(choices).map(function (k) {
      return '<dt>' + k[0].toUpperCase() + k.slice(1) + '</dt><dd>' + choices[k].map(function (v) {
        var p = new URLSearchParams(q); p.set(k, v);
        return '<a href="?' + p + '"' + (v === cfg[k] ? ' aria-current="true"' : '') + '>' + v + '</a>';
      }).join('') + '</dd>';
    }).join('');

    var attrs = (cfg.mode === 'countdown' ? ' data-countdown="7"' : '') +
      (cfg.position !== 'bottom-left' ? ' data-position="' + cfg.position + '"' : '') +
      (cfg.theme !== 'auto' ? ' data-theme="' + cfg.theme + '"' : '');
    var snippet = '<script src="https://cdn.jsdelivr.net/gh/BlixtDunder/Kanelbulle@1/kanelbulle.min.js"' + attrs + ' defer><\/script>';
    document.getElementById('snippet').textContent = snippet;
    document.getElementById('copy').onclick = function () {
      navigator.clipboard.writeText(snippet);
      this.textContent = 'Copied';
    };
    document.getElementById('reset').onclick = function () { location.reload(); };

    document.documentElement.lang = cfg.lang;
    window.KanelbulleConfig = { position: cfg.position, theme: cfg.theme };
    // Use the built-in preview so the banner shows whatever the date
    history.replaceState(null, '', location.search + (cfg.mode === 'countdown' ? '#kanelbulle-3' : '#kanelbulle'));
  </script>
  <script src="kanelbulle.js"></script>
</body>
</html>
